name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="$ANDROID_HOME"
          echo "SDK dir: $SDK"
          ls "$SDK" || true
          SDKM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find . -name '*.apk' -path '*/outputs/*' -exec cp {} out/ \;
          ls -la out || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsHUD-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); }
            catch (e) { log = 'no build.log: ' + e.message; }
            const tail = log.length > 14000 ? log.slice(-14000) : log;
            const title = '[auto] build failed ' + context.sha.substring(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: '```\n' + tail + '\n```'
            });
